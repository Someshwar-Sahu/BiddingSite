<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operations Desk Login - NexTrade Auctions</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen text-slate-100 flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800/90 rounded-2xl border border-slate-700 shadow-2xl p-8 space-y-6 backdrop-blur-md">

    <!-- BRAND LOGO & TITLE -->
    <div class="text-center space-y-2">
      <div class="inline-flex items-center gap-2 bg-blue-600 text-white font-black px-3.5 py-1.5 rounded-lg text-sm tracking-wider shadow">
        <span>NTA</span>
      </div>
      <h1 class="text-2xl font-black text-white tracking-tight">NexTrade <span class="text-blue-400 font-medium">Auctions</span></h1>
      <p class="text-xs text-slate-400">Restricted Operations Desk & Superadmin Control Portal</p>
    </div>

    <!-- ERROR ALERT -->
    <div id="error-alert" class="hidden p-3 rounded-lg bg-red-900/50 border border-red-700 text-xs text-red-200"></div>

    <!-- LOGIN FORM -->
    <form id="admin-login-form" class="space-y-4 text-xs">
      <div>
        <label class="font-bold text-slate-300 block mb-1">Administrative Email</label>
        <input 
          id="admin-email" 
          type="email" 
          required 
          value="admin@nextradeauctions.com"
          placeholder="admin@nextradeauctions.com" 
          class="w-full bg-slate-900/80 border border-slate-700 p-3 rounded-lg text-white font-medium focus:ring-2 focus:ring-blue-500 focus:outline-none"
        />
      </div>

      <div>
        <label class="font-bold text-slate-300 block mb-1">Security Passkey / Password</label>
        <input 
          id="admin-password" 
          type="password" 
          required 
          value="NTA_Admin_2026!"
          placeholder="••••••••••••" 
          class="w-full bg-slate-900/80 border border-slate-700 p-3 rounded-lg text-white font-medium focus:ring-2 focus:ring-blue-500 focus:outline-none"
        />
      </div>

      <button 
        type="submit" 
        id="btn-login"
        class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg text-xs shadow-lg transition-all flex items-center justify-center gap-2"
      >
        <span>🔒</span> Authenticate & Enter Operations Desk
      </button>
    </form>

    <!-- DEMO QUICK ACCESS -->
    <div class="pt-4 border-t border-slate-700/80 space-y-3">
      <div class="flex items-center justify-between text-[11px] text-slate-400">
        <span>Evaluation Demo Passkey:</span>
        <code class="text-blue-300 bg-slate-900 px-2 py-0.5 rounded">NTA_Admin_2026!</code>
      </div>

      <button 
        type="button" 
        id="btn-quick-admin"
        class="w-full bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold py-2 rounded-lg text-xs transition-colors flex items-center justify-center gap-1.5"
      >
        <span>⚡</span> 1-Click Operations Lead Sign In
      </button>
    </div>

    <!-- DOMAIN ISOLATION NOTICE -->
    <div class="text-center text-[10px] text-slate-500">
      Zero-Trust Realm: <span class="font-mono text-slate-400">admin.nextradeauctions.com</span>. Unauthorized attempts are logged.
    </div>

  </div>

  <script>
    // Immediate redirect lock: if session active, replace page without waiting
    fetch('/api/admin/me')
      .then(r => r.ok ? r.json() : null)
      .then(d => { if (d?.user) window.location.replace('/admin/auctions'); })
      .catch(() => {});

    window.addEventListener('pageshow', (event) => {
      if (event.persisted) {
        window.location.reload();
      }
    });

    const form = document.getElementById('admin-login-form');
    const emailInput = document.getElementById('admin-email');
    const passInput = document.getElementById('admin-password');
    const errorAlert = document.getElementById('error-alert');
    const submitBtn = document.getElementById('btn-login');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying credentials...';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: emailInput.value,
            password: passInput.value
          })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || 'Authentication failed.');
        }

        window.location.replace(data.redirect || '/admin/auctions');
      } catch (err) {
        errorAlert.textContent = err.message;
        errorAlert.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = '🔒 Authenticate & Enter Operations Desk';
      }
    });

    document.getElementById('btn-quick-admin').addEventListener('click', () => {
      emailInput.value = 'admin@nextradeauctions.com';
      passInput.value = 'NTA_Admin_2026!';
      form.requestSubmit();
    });
  </script>
</body>
</html>
