<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendor Directory & KYC - NexTrade Auctions</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <!-- TOP SHARED NAV -->
  <header id="admin-header" class="bg-[#1e2238] py-4 shadow-md sticky top-0 z-40"></header>

  <main class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8 space-y-6">

    <!-- HEADER & FILTERS -->
    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <h1 class="text-xl font-bold text-slate-900">Master Vendor Directory & KYC Queue</h1>
        <p class="text-xs text-slate-500 mt-0.5">Verify vendor onboarding credentials, review tax compliance (GST/PAN), and approve suppliers for tenders.</p>
      </div>

      <div class="flex items-center gap-3">
        <input id="vendor-search" type="text" placeholder="Search by name, GSTIN, email..." class="text-xs border border-slate-300 rounded-lg px-3 py-2 w-64 focus:outline-none focus:ring-2 focus:ring-blue-500" />

        <select id="vendor-status-filter" class="text-xs border border-slate-300 rounded-lg px-3 py-2 bg-slate-50 font-medium text-slate-700">
          <option value="all">All Statuses</option>
          <option value="pending_approval">Pending Approval</option>
          <option value="approved">Approved</option>
        </select>
      </div>
    </div>

    <!-- VENDORS TABLE -->
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-50 text-slate-700 font-bold border-b border-slate-200">
            <tr>
              <th class="p-4">Supplier Company</th>
              <th class="p-4">Contact Representative</th>
              <th class="p-4">Email & Phone</th>
              <th class="p-4">Tax Identification (GST/PAN)</th>
              <th class="p-4">Compliance Status</th>
              <th class="p-4 text-center">Verification Action</th>
            </tr>
          </thead>
          <tbody id="vendors-tbody" class="divide-y divide-slate-100">
            <tr>
              <td colspan="6" class="p-8 text-center text-slate-400">Loading master vendor directory...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script type="module" src="/js/admin/vendors.js"></script>
</body>
</html>
